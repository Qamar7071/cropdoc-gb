repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=25000]
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: ruff check --fix
        language: python
        additional_dependencies: [ruff==0.17.4]
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: python
        additional_dependencies: [ruff==0.17.4]
        types: [python]
